name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pygraphistry_ref:
        description: "pygraphistry ref (branch/tag/sha)"
        required: false
        default: ""
      pygraphistry_repo:
        description: "pygraphistry repo URL"
        required: false
        default: "https://github.com/graphistry/pygraphistry.git"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pygraphistry ref
        id: pygraphistry
        env:
          PYGRAPHISTRY_REF_INPUT: ${{ github.event.inputs.pygraphistry_ref || '' }}
          PYGRAPHISTRY_REPO_INPUT: ${{ github.event.inputs.pygraphistry_repo || 'https://github.com/graphistry/pygraphistry.git' }}
        run: |
          pygraphistry_repo="${PYGRAPHISTRY_REPO_INPUT}"
          pygraphistry_ref="${PYGRAPHISTRY_REF_INPUT}"
          candidate_ref="master"

          if [[ "${{ github.event_name }}" == "pull_request" && -n "${{ github.head_ref }}" ]]; then
            candidate_ref="${{ github.head_ref }}"
          elif [[ -n "${{ github.ref_name }}" ]]; then
            candidate_ref="${{ github.ref_name }}"
          fi

          if [[ -z "${pygraphistry_ref}" ]]; then
            pygraphistry_ref="master"
            if git ls-remote --exit-code --heads "${pygraphistry_repo}" "${candidate_ref}" >/dev/null 2>&1; then
              pygraphistry_ref="${candidate_ref}"
            fi
          fi

          echo "repo=${pygraphistry_repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${pygraphistry_ref}" >> "$GITHUB_OUTPUT"
          echo "Using pygraphistry ref: ${pygraphistry_ref}"

      - name: Checkout pygraphistry
        run: |
          git clone --depth 1 "${{ steps.pygraphistry.outputs.repo }}" pygraphistry
          cd pygraphistry
          git fetch --depth 1 origin "${{ steps.pygraphistry.outputs.ref }}"
          git checkout FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas

      - name: Run tests
        env:
          PYGRAPHISTRY_INSTALL: "1"
          PYGRAPHISTRY_PATH: pygraphistry
        run: |
          echo "Using pygraphistry ref: ${{ steps.pygraphistry.outputs.ref }}"
          ./bin/ci.sh
