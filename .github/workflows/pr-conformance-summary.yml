name: PR Conformance Summary

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to comment on; leave empty to generate artifacts only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      UV_VERSION: "0.11.3"
      UV_EXCLUDE_NEWER: "6 days"
      SUMMARY_ARTIFACT_NAME: unified-conformance-summary
    steps:
      - name: Checkout PR head
        # Node24-era major; guarded by tests/cypher_tck/test_workflow_action_versions.py.
        uses: actions/checkout@v6
        with:
          path: head

      - name: Checkout base
        # Node24-era major; guarded by tests/cypher_tck/test_workflow_action_versions.py.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base-tck-gfql

      - name: Resolve pygraphistry ref
        id: pygraphistry
        working-directory: head
        env:
          PYGRAPHISTRY_REPO_INPUT: https://github.com/graphistry/pygraphistry.git
        run: |
          pygraphistry_repo="${PYGRAPHISTRY_REPO_INPUT}"
          candidate_ref="master"

          if [[ "${{ github.event_name }}" == "pull_request" && -n "${{ github.head_ref }}" ]]; then
            candidate_ref="${{ github.head_ref }}"
          elif [[ -n "${{ github.ref_name }}" ]]; then
            candidate_ref="${{ github.ref_name }}"
          fi

          pygraphistry_ref="master"
          if git ls-remote --exit-code --heads "${pygraphistry_repo}" "${candidate_ref}" >/dev/null 2>&1; then
            pygraphistry_ref="${candidate_ref}"
          fi

          echo "repo=${pygraphistry_repo}" >> "$GITHUB_OUTPUT"
          echo "ref=${pygraphistry_ref}" >> "$GITHUB_OUTPUT"
          echo "Using pygraphistry ref: ${pygraphistry_ref}"

      - name: Checkout pygraphistry
        run: |
          git clone --depth 1 "${{ steps.pygraphistry.outputs.repo }}" pygraphistry
          cd pygraphistry
          git fetch --depth 1 origin "${{ steps.pygraphistry.outputs.ref }}"
          git checkout FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv (pinned)
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          UV_EXCLUDE_NEWER="${UV_EXCLUDE_NEWER}" uv pip install --python "$(command -v python)" pytest pandas
          uv pip install --python "$(command -v python)" -e pygraphistry

      - name: Generate unified conformance summary
        working-directory: head
        env:
          PYGRAPHISTRY_REF: ${{ steps.pygraphistry.outputs.ref }}
          PYTHONPATH: ${{ github.workspace }}/pygraphistry:${{ github.workspace }}/head
        run: |
          python -m tests.cypher_tck.pr_conformance_comment \
            --base-dir "${{ github.workspace }}/base-tck-gfql" \
            --head-dir "${{ github.workspace }}/head" \
            --output-dir build/pr-conformance-summary \
            --pygraphistry-path "${{ github.workspace }}/pygraphistry" \
            --base-label "${{ github.base_ref || 'main' }}" \
            --head-label "${{ github.head_ref || github.sha }}" \
            --json-artifact-name "${SUMMARY_ARTIFACT_NAME}"

      - name: Upload unified conformance artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SUMMARY_ARTIFACT_NAME }}
          path: |
            head/build/pr-conformance-summary/unified-conformance-summary.json
            head/build/pr-conformance-summary/unified-conformance-summary.md
            head/build/pr-conformance-summary/direct-cypher-snapshot-delta.json
            head/build/pr-conformance-summary/direct-cypher-snapshot-delta.md
            head/build/pr-conformance-summary/unified-conformance-pr-comment.md
          if-no-files-found: error

  comment:
    if: ${{ github.event_name == 'pull_request' }}
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    env:
      SUMMARY_ARTIFACT_NAME: unified-conformance-summary
      COMMENT_MARKER: "<!-- tck-gfql-unified-conformance-summary -->"
    steps:
      - name: Download unified conformance artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SUMMARY_ARTIFACT_NAME }}
          path: pr-conformance-summary

      - name: Find existing summary comment
        id: find-comment
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: ${{ env.COMMENT_MARKER }}

      - name: Create or update summary comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body-path: pr-conformance-summary/unified-conformance-pr-comment.md
